services:
  - type: web
    name: kumaran-travels-api
    env: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Set DATABASE_URL in the Render dashboard to your PostgreSQL connection string
      # (from Render's PostgreSQL add-on, Supabase, Neon, etc.)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
